info:
  name: Get account
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/accounts/{{account_id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "The account: `account_id`, `external_ref`, `status`, and whether the user has signed in yet (`linked`)."
