info:
  name: Delete staff member
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/v1/staff/{{staff_id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Final. To switch a leaver off and keep the record, use *Change staff member* with `"enabled": false`.'
