apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wallet-auth
resources:
  - k8s/serviceaccount.yaml
  - k8s/externalsecret-db-migrator.yaml
  - k8s/externalsecret-db-app.yaml
  - k8s/migrate-job.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/httproute.yaml

# This one line IS the deployment: Argo CD reconciles the cluster to whatever tag is
# committed here. It is bumped BY HAND for now -- semantic-release commits only
# CHANGELOG.md, so a release builds and pushes an image and deploys nothing. Bump it
# with a no-release commit type (chore(deploy): ...), or the bump itself cuts a
# release of an image identical to the one it points at.
#
# 0.3.0 is the floor for the Deployment: V2__grant_app_role.sql is what lets auth_app
# read its own table. An older tag starts healthy and fails every query.
images:
  - name: ghcr.io/vaullet-dev/auth-service
    newTag: "0.4.0"
