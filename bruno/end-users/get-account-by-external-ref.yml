info:
  name: Get account by external ref
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/accounts/by-ref/{{external_ref}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The same account, found by your own identifier.
