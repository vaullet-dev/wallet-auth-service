info:
  name: Build info
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/actuator/info"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Which build is running: `build.version` and the full `git.commit.id`. Public, so no sign-in."
