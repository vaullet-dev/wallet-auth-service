info:
  name: Get identity
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/v1/accounts/{{account_id}}/identity"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Username, email address and names, read from Keycloak on every call. Vaullet stores none of it.
