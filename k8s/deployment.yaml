# The running service. Holds auth_app, which V2 granted SELECT/INSERT/UPDATE on
# its tables -- accounts, and through V2's default privileges V3's outbox -- and
# nothing else: no DDL, not even DELETE. The migration Job holds a different
# role; neither process can do the other's job.
#
# Sync wave 1, after the migration Job (a Sync hook in wave 0). Argo applies this
# only once the Job has succeeded, so a new version never starts in front of a
# schema it was not built for -- V3's outbox table, the first the code cannot
# run without, included. Until #39 both were wave 0 and nothing waited.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: { app: auth-service }
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        # The published image is a Paketo buildpack build, and the JVM needs a
        # writable /tmp -- without this, readOnlyRootFilesystem below stops it
        # starting.
        - name: tmp
          emptyDir: {}
      containers:
        - name: auth-service
          image: ghcr.io/vaullet-dev/auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: APP_ENVIRONMENT,        value: prod }

            # Paketo derives the heap by SUBTRACTING a fixed code cache, metaspace
            # and thread_count x 1M from the container limit. 200 matches
            # server.tomcat.threads.max in application-prod.yaml, so the accounting
            # reflects what actually runs.
            - { name: BPL_JVM_THREAD_COUNT,   value: "200" }

            # platform-rw always points at the current primary. currentSchema
            # rather than a later search_path: ADR-003 puts keycloak_schema in this
            # same database, and it is emphatically not ours -- Keycloak's 100
            # tables live one schema away.
            - name: DB_URL
              value: jdbc:postgresql://platform-rw.postgres.svc:5432/auth_db?currentSchema=identity_schema
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-app, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-app, key: DB_PASSWORD } }

            # No default in application.yaml, deliberately: unset means no
            # JwtDecoder and the context refuses to start rather than serving
            # unauthenticated. Must equal Keycloak's issuer character for
            # character -- it is compared against every token's `iss`. Keycloak
            # is served under vaullet.dev/auth (gitops: keycloak.yaml, KC_HOSTNAME
            # and http.relativePath).
            - name: OAUTH2_ISSUER_URI
              value: https://vaullet.dev/auth/realms/vaullet

            # ADR-014: this deployment manages end users itself. The Admin API is
            # reached on Keycloak's in-cluster Service, not on vaullet.dev/auth, whose
            # /auth/admin/ route should close. Realm and client id keep their defaults
            # (vaullet, wallet-auth-service).
            - { name: AUTH_PROVIDER, value: local }
            - { name: KEYCLOAK_URL,  value: "http://keycloak-keycloakx-http.keycloak.svc/auth" }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-client, key: KEYCLOAK_CLIENT_SECRET } }

            # The outbox relay (#39) opens every new account's REAL and BONUS wallets
            # in the ledger, on its in-cluster Service: the ledger has no public route
            # (ADR-008). Its token is the Keycloak client above asking for ledger:write,
            # which the client offers as an optional scope (gitops#30). Until the
            # ledger is deployed (wallet-ledger-service#12) entries wait and retry.
            # The switch: "false" stops delivery and entries queue until it is "true"
            # again -- every replica reads it, so set it here, not on one pod.
            - { name: AUTH_OUTBOX_RELAY_ENABLED, value: "true" }
            - { name: LEDGER_URL,                value: "http://ledger-service.wallet-ledger.svc" }

          # Liveness and readiness are separate endpoints for a reason: readiness
          # fails while the database is unreachable so traffic stops, but liveness
          # keeps passing so the kubelet does not restart a healthy JVM over an
          # outage it cannot fix by restarting.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30      # up to 150s for a cold JVM

          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 1536Mi }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
