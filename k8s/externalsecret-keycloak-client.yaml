# The secret this service authenticates to Keycloak's Admin API with (ADR-014, issue #17):
# client `wallet-auth-service` in realm `vaullet`, whose service account holds realm-management
# manage-users, view-users and view-realm, and nothing else.
#
# Consumed by k8s/deployment.yaml as KEYCLOAK_CLIENT_SECRET, and only read with AUTH_PROVIDER=local.
#
# The same OpenBao path is read a second time in the `keycloak` namespace (gitops,
# apps/keycloak-config) so keycloak-config-cli sets the client's secret to this value: one value,
# two readers, the pattern db-app already follows. Put it there once, with a value you generate:
#
#   bao kv put kv/wallet-auth/keycloak-client secret="$(openssl rand -base64 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-auth
  target:
    name: keycloak-client
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        KEYCLOAK_CLIENT_SECRET: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: wallet-auth/keycloak-client
        property: secret
