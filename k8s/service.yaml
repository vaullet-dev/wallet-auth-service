# ClusterIP. Public traffic arrives through k8s/httproute.yaml as vaullet.dev/api/auth;
# callers inside the cluster use this Service directly (ADR-008 governs
# service-to-service auth).
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: { app: auth-service }
  ports:
    - { name: http, port: 80, targetPort: http }
