# The credential the RUNNING SERVICE holds. Distinct from db-migrator in one way
# that matters: this role has no DDL rights (V2 grants it SELECT/INSERT/UPDATE on
# one table and nothing else), so "the application cannot drop a table" is a
# property of what is mounted rather than a promise in a document.
#
# Consumed by k8s/deployment.yaml. The same OpenBao path is read a second time in
# the `postgres` namespace (gitops, credentials.yaml) so CloudNativePG sets the
# auth_app role's password to this value: one value, two readers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-auth
  target:
    name: db-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_USERNAME: auth_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-auth/db-app
        property: password
