<svg xmlns="http://www.w3.org/2000/svg" class="erd" viewBox="0 0 1230 507" width="1230" height="507" role="img" aria-label="Entity-relationship diagram of identity_schema in auth_db: outbox references accounts by account_id, at most one account-created event per account." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .tname, .cname, .ctype, .ctype-l, .mk, .mk-pk, .elabel { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .plabel, .psub, .tcount, .foot, .rlabel, .rlabel2, .lhead, .ltext { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .panel.auth { fill: #172029; } .panel.ledger { fill: #16211B; }
  .plabel { font-size: 16px; font-weight: 600; fill: #E2EAE5; }
  .psub { font-size: 12px; fill: #9AABA2; }
  .card { fill: #1A221E; stroke: #36443D; stroke-width: 1; }
  .head.auth { fill: #22303D; } .head.ledger { fill: #213129; }
  .tname { font-size: 13px; font-weight: 600; fill: #E2EAE5; }
  .tcount { font-size: 10.5px; fill: #8A9A91; }
  .hair { stroke: #2B3731; stroke-width: 1; }
  .cname { font-size: 12px; fill: #E2EAE5; } .pkname { font-weight: 600; }
  .ctype, .ctype-l { font-size: 12px; fill: #8A9A91; }
  .mk-pk { font-size: 9.5px; font-weight: 700; fill: #5BC79A; letter-spacing: .04em; }
  .mk { font-size: 9.5px; font-weight: 600; fill: #8A9A91; letter-spacing: .04em; }
  .foot { font-size: 11px; font-style: italic; fill: #9AABA2; }
  .edge { fill: none; stroke: #7F9188; stroke-width: 1.3; stroke-linejoin: round; }
  .mark { stroke: #7F9188; stroke-width: 1.3; } .mark-o { fill: #1A221E; stroke: #7F9188; stroke-width: 1.3; }
  .elabel { font-size: 10.5px; fill: #9AABA2; }
  .relay { fill: none; stroke: #E99355; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .relay-head, .relay-dot { fill: #E99355; }
  .rlabel { font-size: 12px; font-weight: 600; fill: #F0A468; }
  .rlabel2 { font-size: 11.5px; fill: #F0A468; }
  .lhead { font-size: 12px; font-weight: 600; fill: #E2EAE5; letter-spacing: .06em; text-transform: uppercase; }
  .ltext { font-size: 12px; fill: #9AABA2; }
</style>
<rect x="0" y="0" width="1230" height="507" fill="#111714"/>
<rect class="panel auth" x="20" y="20" width="790" height="467" rx="10"/>
<text class="plabel" x="40" y="50">auth_db</text>
<text class="psub" x="126" y="50">cluster platform · schema identity_schema · owner auth_migrator · wallet-auth-service</text>
<path class="edge" d="M480.0,263.5 L431.0,263.5 Q425.0,263.5 425.0,257.5 L425.0,117.5 Q425.0,111.5 419.0,111.5 L370.0,111.5"/>
<line class="mark" x1="473.0" y1="257.5" x2="473.0" y2="269.5"/><circle class="mark-o" cx="465.0" cy="263.5" r="3.6"/>
<line class="mark" x1="377.0" y1="117.5" x2="377.0" y2="105.5"/><line class="mark" x1="381.0" y1="117.5" x2="381.0" y2="105.5"/>
<g class="tbl">
<rect class="card" x="70" y="72" width="300" height="220" rx="6"/>
<path class="head auth" d="M70,102 V78 Q70,72 76,72 H364 Q370,72 370,78 V102 Z"/>
<text class="tname" x="82" y="92">accounts</text>
<text class="tcount" x="360" y="92" text-anchor="end">6 columns</text>
<line class="hair" x1="70" y1="102" x2="370" y2="102"/>
<text class="mk-pk" x="79" y="115.0">PK</text>
<text class="cname pkname" x="116" y="115.5">account_id</text>
<text class="ctype" x="360" y="115.5" text-anchor="end">uuid</text>
<text class="mk" x="79" y="134.0">UQ</text>
<text class="cname" x="116" y="134.5">keycloak_sub</text>
<text class="ctype" x="360" y="134.5" text-anchor="end">uuid?</text>
<text class="mk" x="79" y="153.0">UQ</text>
<text class="cname" x="116" y="153.5">external_ref</text>
<text class="ctype" x="360" y="153.5" text-anchor="end">text?</text>
<text class="cname" x="116" y="172.5">status</text>
<text class="ctype" x="360" y="172.5" text-anchor="end">text</text>
<text class="cname" x="116" y="191.5">created_at</text>
<text class="ctype" x="360" y="191.5" text-anchor="end">timestamptz</text>
<text class="cname" x="116" y="210.5">updated_at</text>
<text class="ctype" x="360" y="210.5" text-anchor="end">timestamptz</text>
<line class="hair" x1="80" y1="220" x2="360" y2="220"/>
<text class="foot" x="82" y="235">status: ACTIVE · SUSPENDED · CLOSED</text>
<text class="foot" x="82" y="250">external_ref or keycloak_sub required</text>
<text class="foot" x="82" y="265">trigger: external_ref fixed once set</text>
<text class="foot" x="82" y="280">trigger: CLOSED is final</text>
</g>
<g class="tbl">
<rect class="card" x="480" y="72" width="300" height="395" rx="6"/>
<path class="head auth" d="M480,102 V78 Q480,72 486,72 H774 Q780,72 780,78 V102 Z"/>
<text class="tname" x="492" y="92">outbox</text>
<text class="tcount" x="770" y="92" text-anchor="end">16 columns</text>
<line class="hair" x1="480" y1="102" x2="780" y2="102"/>
<text class="mk-pk" x="489" y="115.0">PK</text>
<text class="cname pkname" x="526" y="115.5">event_id</text>
<text class="ctype" x="770" y="115.5" text-anchor="end">uuid</text>
<text class="cname" x="526" y="134.5">event_type</text>
<text class="ctype" x="770" y="134.5" text-anchor="end">text</text>
<text class="cname" x="526" y="153.5">schema_version</text>
<text class="ctype" x="770" y="153.5" text-anchor="end">text</text>
<text class="cname" x="526" y="172.5">occurred_at</text>
<text class="ctype" x="770" y="172.5" text-anchor="end">timestamptz</text>
<text class="cname" x="526" y="191.5">producer_service</text>
<text class="ctype" x="770" y="191.5" text-anchor="end">text</text>
<text class="cname" x="526" y="210.5">producer_version</text>
<text class="ctype" x="770" y="210.5" text-anchor="end">text?</text>
<text class="cname" x="526" y="229.5">correlation_id</text>
<text class="ctype" x="770" y="229.5" text-anchor="end">text?</text>
<text class="cname" x="526" y="248.5">causation_id</text>
<text class="ctype" x="770" y="248.5" text-anchor="end">text?</text>
<text class="mk" x="489" y="267.0">FK</text>
<text class="cname" x="526" y="267.5">account_id</text>
<text class="ctype" x="770" y="267.5" text-anchor="end">uuid</text>
<text class="cname" x="526" y="286.5">payload</text>
<text class="ctype" x="770" y="286.5" text-anchor="end">jsonb</text>
<text class="cname" x="526" y="305.5">queued_at</text>
<text class="ctype" x="770" y="305.5" text-anchor="end">timestamptz</text>
<text class="cname" x="526" y="324.5">attempts</text>
<text class="ctype" x="770" y="324.5" text-anchor="end">integer</text>
<text class="cname" x="526" y="343.5">next_attempt_at</text>
<text class="ctype" x="770" y="343.5" text-anchor="end">timestamptz</text>
<text class="cname" x="526" y="362.5">last_attempt_at</text>
<text class="ctype" x="770" y="362.5" text-anchor="end">timestamptz?</text>
<text class="cname" x="526" y="381.5">last_error</text>
<text class="ctype" x="770" y="381.5" text-anchor="end">text?</text>
<text class="cname" x="526" y="400.5">delivered_at</text>
<text class="ctype" x="770" y="400.5" text-anchor="end">timestamptz?</text>
<line class="hair" x1="490" y1="410" x2="770" y2="410"/>
<text class="foot" x="492" y="425">≤ 1 identity.account-created per account</text>
<text class="foot" x="492" y="440">relay retries until delivered_at is set</text>
<text class="foot" x="492" y="455">attempts ≥ 0 · payload is a JSON object</text>
</g>
<text class="lhead" x="900" y="76">Legend</text>
<text class="mk-pk" x="900" y="100">PK</text><text class="ltext" x="944" y="100">primary key</text>
<text class="mk" x="900" y="120">FK</text><text class="ltext" x="944" y="120">foreign key</text>
<text class="mk" x="900" y="140">UQ</text><text class="ltext" x="944" y="140">unique on its own</text>
<text class="ctype-l" x="900" y="160">text?</text><text class="ltext" x="944" y="160">nullable column</text>
<path class="edge" d="M900,184 H934"/>
<line class="mark" x1="913.0" y1="184.0" x2="900.0" y2="177.0"/><line class="mark" x1="913.0" y1="184.0" x2="900.0" y2="184.0"/><line class="mark" x1="913.0" y1="184.0" x2="900.0" y2="191.0"/><line class="mark" x1="917.0" y1="190.0" x2="917.0" y2="178.0"/>
<text class="ltext" x="944" y="188">many (the table holding the key)</text>
<path class="edge" d="M900,206 H934"/>
<line class="mark" x1="927.0" y1="200.0" x2="927.0" y2="212.0"/><line class="mark" x1="923.0" y1="200.0" x2="923.0" y2="212.0"/>
<text class="ltext" x="944" y="210">exactly one</text>
<path class="edge" d="M900,228 H934"/>
<line class="mark" x1="927.0" y1="222.0" x2="927.0" y2="234.0"/><circle class="mark-o" cx="919.0" cy="228.0" r="3.6"/>
<text class="ltext" x="944" y="232">zero or one</text>
<text class="lhead" x="900" y="268">Not drawn</text>
<text class="ltext" x="900" y="290">flyway_schema_history</text>
<text class="ltext" x="900" y="308">Keycloak&#x27;s own tables in auth_db</text>
<text class="lhead" x="900" y="348">Source</text>
<text class="ltext" x="900" y="370">PostgreSQL 18.6, after Flyway V1–V3</text>
<text class="ltext" x="900" y="388">wallet-auth-service 43d0615 (0.12.2)</text>
<text class="ltext" x="900" y="406">roles and owners as in gitops apps/db</text>
</svg>
