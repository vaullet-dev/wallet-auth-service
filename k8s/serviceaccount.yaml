# The identity OpenBao's Kubernetes auth role is bound to. The name is fixed by
# bootstrap/03-openbao.sh's onboarding convention: the role is bound to exactly
# this service account name in exactly this namespace, so a pod in any other
# namespace cannot borrow it.
#
# Nothing else uses it. The migration Job runs under `default`; this account
# exists only so External Secrets can log in to OpenBao on this namespace's behalf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
