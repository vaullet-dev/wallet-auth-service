info:
  name: Get staff member
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/staff/{{staff_id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`404` when there is no such user, or the user is not staff."
