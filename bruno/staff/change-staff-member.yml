info:
  name: Change staff member
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url}}/v1/staff/{{staff_id}}"
  body:
    type: json
    data: |-
      {
        "first_name": "Ana",
        "last_name": "Kovač-Horvat"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Email address, names, and `enabled`. Omitted fields stay as they are; a new address is marked unverified. `"enabled": false` switches a leaver off: they cannot sign in and their sessions end.'
