# The credential the RUNNING SERVICE holds. Distinct from db-migrator in one way
# that matters: this role has no DDL rights (V2 grants it SELECT/INSERT/UPDATE on
# one table and nothing else), so "the application cannot drop a table" is a
# property of what is mounted rather than a promise in a document.
#
# Not yet consumed -- the Deployment lands with Keycloak, since an unset
# OAUTH2_ISSUER_URI makes the context refuse to start. Present now so the role
# gets its password in the same pass as the migrator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-auth
  target:
    name: db-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_USERNAME: auth_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-auth/db-app
        property: password
