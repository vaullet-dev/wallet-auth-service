<text x="24" y="238" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#737288">CHECK CONSTRAINTS</text>
<text x="24" y="258" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1B1B2E">accounts_external_ref_not_blank_ck</text>
<text x="330" y="258" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#737288">CHECK (((external_ref IS NULL) OR (length(btrim(external_ref)) &gt; 0)))</text>
<text x="24" y="278" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1B1B2E">accounts_natural_key_ck</text>
<text x="330" y="278" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#737288">CHECK (((external_ref IS NOT NULL) OR (keycloak_sub IS NOT NULL)))</text>
<text x="24" y="298" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1B1B2E">accounts_status_ck</text>
<text x="330" y="298" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#737288">CHECK ((status = ANY (ARRAY[&#x27;ACTIVE&#x27;::text, &#x27;SUSPENDED&#x27;::text, &#x27;CLOSED&#x27;::text])))</text>
<text x="24" y="332" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#737288">TRIGGERS</text>
<text x="24" y="352" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1B1B2E">accounts_invariants</text>
<text x="330" y="352" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#737288">BEFORE UPDATE · FOR EACH ROW · accounts_enforce_invariants()</text>
