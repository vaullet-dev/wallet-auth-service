info:
  name: Send password reset
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/v1/accounts/{{account_id}}/password-reset"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Keycloak emails a link to set a new password. Also how to send an invitation again. Once the user can sign in, the link goes only to a verified address (`409 EMAIL_NOT_VERIFIED` otherwise).
