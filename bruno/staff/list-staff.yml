info:
  name: List staff
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/staff?limit=50"
  params:
    - name: limit
      value: "50"
      type: query
    - name: cursor
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: By username, a page at a time. Pass `next_cursor` from the response as `cursor` for the next page; no `next_cursor` means the last page.
