info:
  name: Get my account
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/accounts/me"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.getEnvName() === "local") {
          bru.runner.skipRequest();
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The signed-in user's account. `404` until *Create my account* has made it.
